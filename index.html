<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Hernandez | Data Scientist</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0d1117;
            overflow: hidden;
        }

        .splash {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* ── panels ── */
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            cursor: pointer;
            position: relative;
            transition: flex 0.55s cubic-bezier(0.77,0,0.18,1);
            overflow: hidden;
            text-decoration: none;
        }

        .panel-en { background: #0d1117; }
        .panel-es { background: #111827; }

        .panel-en:hover  { flex: 1.35; }
        .panel-es:hover  { flex: 1.35; }
        .panel-en:hover ~ .panel-es { flex: 0.72; }

        /* divider */
        .divider {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1px;
            height: 60%;
            background: linear-gradient(to bottom,
                transparent,
                rgba(255,255,255,0.12) 20%,
                rgba(255,255,255,0.12) 80%,
                transparent);
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .splash:has(.panel:hover) .divider { opacity: 0; }

        /* glow behind content */
        .panel::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .panel-en::before { background: radial-gradient(circle, rgba(79,142,247,0.10) 0%, transparent 70%); }
        .panel-es::before { background: radial-gradient(circle, rgba(45,212,191,0.10) 0%, transparent 70%); }
        .panel:hover::before { opacity: 1; }

        /* content */
        .panel-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4rem;
            z-index: 1;
            user-select: none;
        }

        .lang-tag {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 0.35rem 1rem;
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        .panel-en .lang-tag {
            color: #4f8ef7;
            border: 1.5px solid rgba(79,142,247,0.35);
            background: rgba(79,142,247,0.06);
        }
        .panel-es .lang-tag {
            color: #2dd4bf;
            border: 1.5px solid rgba(45,212,191,0.35);
            background: rgba(45,212,191,0.06);
        }
        .panel-en:hover .lang-tag { background: rgba(79,142,247,0.14); }
        .panel-es:hover .lang-tag { background: rgba(45,212,191,0.14); }

        .lang-word {
            font-size: clamp(3rem, 7vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 1;
            color: #e8eaf0;
            transition: transform 0.4s ease;
        }
        .panel:hover .lang-word { transform: scale(1.06); }

        .lang-sub {
            font-size: 0.9rem;
            font-weight: 500;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }
        .panel:hover .lang-sub { color: rgba(255,255,255,0.55); }

        .arrow {
            font-size: 1.3rem;
            opacity: 0;
            transform: translateX(-8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            color: rgba(255,255,255,0.5);
        }
        .panel:hover .arrow { opacity: 1; transform: translateX(0); }

        /* brand at top */
        .brand {
            position: absolute;
            top: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            text-align: center;
            pointer-events: none;
        }
        .brand-name {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
        }
        .brand-role {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.18);
            letter-spacing: 1px;
            margin-top: 0.2rem;
        }

        /* prompt at bottom */
        .prompt {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.18);
            white-space: nowrap;
            pointer-events: none;
        }

        /* detected highlight */
        .panel.detected .lang-tag { border-color: rgba(79,142,247,0.6); }
        .panel-es.detected .lang-tag { border-color: rgba(45,212,191,0.6); }

        /* fade-out on click */
        .splash.leaving { animation: fadeOut 0.4s ease forwards; }
        @keyframes fadeOut { to { opacity: 0; } }

        /* mobile */
        @media (max-width: 600px) {
            .splash { flex-direction: column; }
            .panel-en:hover ~ .panel-es { flex: 0.75; }
            .divider { width: 60%; height: 1px; }
            .lang-word { font-size: 3.5rem; letter-spacing: -2px; }
        }
    </style>
</head>
<body>

<div class="splash" id="splash">
    <div class="brand">
        <div class="brand-name">Juan Hernandez</div>
        <div class="brand-role">Data Scientist</div>
    </div>

    <a class="panel panel-en" href="en.html" id="panel-en" onclick="choose('en', event)">
        <div class="panel-inner">
            <span class="lang-tag">EN</span>
            <span class="lang-word">English</span>
            <span class="lang-sub">View portfolio in English</span>
            <span class="arrow">→</span>
        </div>
    </a>

    <div class="divider"></div>

    <a class="panel panel-es" href="es.html" id="panel-es" onclick="choose('es', event)">
        <div class="panel-inner">
            <span class="lang-tag">ES</span>
            <span class="lang-word">Español</span>
            <span class="lang-sub">Ver portafolio en español</span>
            <span class="arrow">→</span>
        </div>
    </a>

    <div class="prompt">Choose your language &middot; Elige tu idioma</div>
</div>

<script>
    // Returning visitor → skip splash
    const saved = localStorage.getItem('lang');
    if (saved) {
        window.location.replace(saved === 'es' ? 'es.html' : 'en.html');
    }

    // Highlight browser-preferred language
    const browserLang = (navigator.language || 'en').toLowerCase();
    const preferES = browserLang.startsWith('es');
    document.getElementById(preferES ? 'panel-es' : 'panel-en').classList.add('detected');

    function choose(lang, e) {
        e.preventDefault();
        localStorage.setItem('lang', lang);
        document.getElementById('splash').classList.add('leaving');
        setTimeout(() => {
            window.location.href = lang === 'es' ? 'es.html' : 'en.html';
        }, 380);
    }
</script>
</body>
</html>
